name: Update events
on:
  schedule:
    - cron: "7 * * * *"   # hourly, off the :00 peak when GitHub delays scheduled runs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-events
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_events.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Commit changes
        if: always()   # keep state.json from a run that failed mid-sync, or the next run reposts
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json state.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update events"
            git push
          fi
